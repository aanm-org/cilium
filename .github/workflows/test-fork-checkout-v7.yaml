# THROWAWAY workflow to prove actions/checkout v7's fork-PR-checkout block.
# Push this to the DEFAULT BRANCH of the BASE repo (aanm-org/cilium), then open
# a PR into it from a fork in a DIFFERENT repo/owner (aanm/cilium).
# pull_request_target reads the workflow from the base repo's default branch, so
# this file must live there, not on the PR branch.
# Delete it once the test is done.
name: TEST fork checkout v7 block

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  without-flag:
    name: Fork checkout WITHOUT flag (expect blocked)
    runs-on: ubuntu-24.04
    steps:
      # Warning: since this is a privileged workflow, subsequent workflow job
      # steps must take care not to execute untrusted code.
      - name: Checkout pull request branch (NOT TRUSTED)
        id: co
        continue-on-error: true
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert the checkout was blocked
        run: |
          if [ "${{ steps.co.outcome }}" != "failure" ]; then
            echo "UNEXPECTED: fork checkout succeeded without allow-unsafe-pr-checkout"
            exit 1
          fi
          echo "OK: checkout v7 refused the fork checkout, as expected"

  with-flag:
    name: Fork checkout WITH flag (expect allowed)
    runs-on: ubuntu-24.04
    steps:
      # Warning: since this is a privileged workflow, subsequent workflow job
      # steps must take care not to execute untrusted code.
      - name: Checkout pull request branch (NOT TRUSTED)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - name: Confirm fork code is present
        run: |
          echo "OK: fork checkout succeeded with allow-unsafe-pr-checkout"
          git log -1 --oneline
          ls -la
